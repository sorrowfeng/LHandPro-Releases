name: Sync Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync source releases
        env:
          TARGET_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          SRC_REPO: sorrowfeng/LHandPro
          SRC_REPO_TOKEN: ${{ secrets.SRC_REPO_TOKEN }}
        run: python .github/scripts/sync_releases.py
